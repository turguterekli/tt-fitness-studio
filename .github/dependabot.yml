# Kullanılan kütüphanelerde bilinen bir güvenlik açığı çıkarsa GitHub otomatik güncelleme önerisi açar.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      capacitor:            # Capacitor paketleri birbirine bağlıdır; tek tek değil birlikte güncellenir
        patterns: ["@capacitor/*"]
    ignore:
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]   # büyük sürüm geçişi elle ve test edilerek yapılır
  - package-ecosystem: npm
    directory: "/tests"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
